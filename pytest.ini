[pytest]
# pytest.ini takes precedence over pyproject.toml, so the whole configuration
# lives here. It covers both suites: the prototypes under src/ and the
# production application under app/.
testpaths = tests
pythonpath = src .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    live_collection: opt-in check against a real vendor site; never part of the deterministic suite
