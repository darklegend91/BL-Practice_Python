[project]
name = "llm-fit-advisor"
version = "0.2.0"
description = "Answers whether to run a language model locally or buy a subscription"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Only needed to fetch real pages; it brings a browser with it.
crawler = ["crawl4ai>=0.4"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# pytest is configured in pytest.ini, which takes precedence over this file.
